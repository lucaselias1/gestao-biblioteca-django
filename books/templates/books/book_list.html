{% extends 'base.html' %}

{% block content %}
<h2>Catálogo de Livros</h2>
<table class="table table-hover bg-white shadow-sm">
    <thead class="table-dark">
        <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>Estoque</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author.name }}</td>
            <td>
              {% if book.is_available %}
               <span class="badge bg-success">Disponível</span>
              {% else %}
               <span class="badge bg-danger">Emprestado</span>
              {% endif %}
            </td>
            <td>
                <a href="{% url 'book_detail' book.pk %}" class="btn btn-sm btn-outline-info">Detalhes</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
